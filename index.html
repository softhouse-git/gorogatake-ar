<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>五老スカイタワー AR展望ガイド</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
// OPENING COUNTDOWN
window.addEventListener('load', function() {
  var op = document.getElementById('op');
  var circle = document.getElementById('opc');
  var numEl = document.getElementById('opn');
  var total = 163.4;
  var count = 5;
  var n = 0;

  var t = setInterval(function() {
    n++;
    var remaining = 5 - n;
    numEl.textContent = remaining;
    circle.setAttribute('stroke-dashoffset', String(total * n / 5));
    if (n >= 5) {
      clearInterval(t);
      op.style.opacity = '0';
      setTimeout(function() { op.style.display = 'none'; }, 650);
    }
  }, 1000);
});
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{width:100%;height:100%;}
body{
  width:100%;height:100%;
  overflow:hidden;
  background:#07111f;
  color:#fff;
  font-family:-apple-system,'Hiragino Sans',sans-serif;
  position:fixed;top:0;left:0;
}

/* カメラ背景 */
#camera-bg{
  position:absolute;inset:0;
  background:#000;
  overflow:hidden;
}
#camera-video{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  min-width:100%;min-height:100%;
  width:auto;height:auto;
  object-fit:cover;
}
/* カメラ未許可時のフォールバック背景 */
#camera-fallback{
  position:absolute;inset:0;
  background:linear-gradient(175deg,#060d1a 0%,#0a1e38 20%,#123358 40%,#1b567a 55%,#2a7a6a 68%,#1e5440 80%,#0f2e20 100%);
  display:block;
}
#sea{position:absolute;bottom:0;left:0;right:0;height:36%;background:linear-gradient(180deg,rgba(20,60,110,.7),rgba(8,25,55,.95));}
.hline{position:absolute;bottom:36%;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(91,200,255,.3),transparent);}

/* HUD */
#hud{
  position:absolute;top:0;left:0;right:0;
  padding:14px 16px 10px;
  background:linear-gradient(180deg,rgba(0,0,0,.3),transparent);
  display:flex;justify-content:space-between;align-items:flex-start;
  z-index:30;pointer-events:none;
}
.ht,.hs,.hd,.hdir{text-shadow:0 1px 4px rgba(0,0,0,.85);}
.ht{font-size:13px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.8);}
.hs{font-size:10px;color:rgba(255,255,255,.4);margin-top:1px;}
.hd{font-size:28px;font-weight:300;text-align:right;line-height:1;}
.hdir{font-size:10px;color:rgba(255,255,255,.5);text-align:right;margin-top:2px;}

/* 言語 */
#lang{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  display:flex;gap:2px;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:3px;
  z-index:31;
}
.lb{
  padding:5px 12px;border-radius:14px;border:none;
  background:transparent;color:rgba(255,255,255,.5);font-size:12px;font-weight:500;
  cursor:pointer;-webkit-appearance:none;
}
.lb.on{background:rgba(91,200,255,.2);color:#5bc8ff;border:1px solid rgba(91,200,255,.3);}

/* フィルター */
#filters{position:absolute;top:58px;right:12px;display:flex;flex-direction:column;gap:5px;z-index:30;}
.fb{
  padding:5px 10px;border-radius:12px;
  border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.5);
  color:rgba(255,255,255,.4);font-size:11px;cursor:pointer;
  white-space:nowrap;text-align:right;-webkit-appearance:none;
}
.fb.on{color:#fff;background:rgba(20,50,90,.7);}
.fb[data-l="近景"].on{border-color:#5bc8ff;color:#5bc8ff;}
.fb[data-l="中景"].on{border-color:#3de8c8;color:#3de8c8;}
.fb[data-l="遠景"].on{border-color:#a78bfa;color:#a78bfa;}
.fb[data-l="超遠景"].on{border-color:#f472b6;color:#f472b6;}

/* ARビュー */
#ar{position:absolute;inset:0;z-index:10;overflow:hidden;}

/* ピン */
.pin{position:absolute;cursor:pointer;}
.plabel{
  padding:5px 12px;border-radius:18px;font-size:12px;font-weight:700;
  white-space:nowrap;background:rgba(0,0,0,.82);
  border:1px solid rgba(255,255,255,.3);letter-spacing:.02em;
  position:absolute;transform:translateX(-50%);
  box-shadow:0 2px 12px rgba(0,0,0,.5);
}
.pdot{
  width:64px;height:64px;border-radius:50%;position:absolute;
  filter:blur(10px);opacity:.8;
}
.pdot-core{
  width:14px;height:14px;border-radius:50%;position:absolute;
  filter:blur(4px);opacity:.95;
}
.pstem{width:1px;position:absolute;opacity:.5;}
.pin[data-l="近景"] .plabel{color:#5bc8ff;border-color:rgba(91,200,255,.4);}
.pin[data-l="中景"] .plabel{color:#3de8c8;border-color:rgba(61,232,200,.4);}
.pin[data-l="遠景"] .plabel{color:#a78bfa;border-color:rgba(167,139,250,.4);}
.pin[data-l="超遠景"] .plabel{color:#f472b6;border-color:rgba(244,114,182,.4);}
.pin[data-l="近景"] .pdot{background:radial-gradient(circle,#5bc8ff 0%,#5bc8ffdd 28%,#5bc8ff77 52%,#5bc8ff22 70%,transparent 82%);}
.pin[data-l="近景"] .pdot-core{background:#5bc8ff;}
.pin[data-l="中景"] .pdot{background:radial-gradient(circle,#3de8c8 0%,#3de8c8dd 28%,#3de8c877 52%,#3de8c822 70%,transparent 82%);}
.pin[data-l="中景"] .pdot-core{background:#3de8c8;}
.pin[data-l="遠景"] .pdot{background:radial-gradient(circle,#a78bfa 0%,#a78bfadd 28%,#a78bfa77 52%,#a78bfa22 70%,transparent 82%);}
.pin[data-l="遠景"] .pdot-core{background:#a78bfa;}
.pin[data-l="超遠景"] .pdot{background:radial-gradient(circle,#f472b6 0%,#f472b6dd 28%,#f472b677 52%,#f472b622 70%,transparent 82%);}
.pin[data-l="超遠景"] .pdot-core{background:#f472b6;}
.pin[data-l="近景"] .pstem{background:linear-gradient(180deg,#5bc8ff,transparent);}
.pin[data-l="中景"] .pstem{background:linear-gradient(180deg,#3de8c8,transparent);}
.pin[data-l="遠景"] .pstem{background:linear-gradient(180deg,#a78bfa,transparent);}
.pin[data-l="超遠景"] .pstem{background:linear-gradient(180deg,#f472b6,transparent);}

/* 地図 */
#mapview{position:absolute;inset:0;z-index:10;display:none;}
#mapview.show{display:block;}
#leafmap{width:100%;height:100%;}
.lf-tip{background:rgba(0,0,0,.8)!important;border:1px solid rgba(255,255,255,.2)!important;color:#fff!important;font-size:11px!important;border-radius:8px!important;padding:2px 8px!important;white-space:nowrap!important;box-shadow:none!important;}
.lf-tip::before{display:none!important;}
.lf-tower{background:rgba(0,0,0,.8)!important;border:1px solid #ffd740!important;color:#ffd740!important;font-size:11px!important;font-weight:700!important;border-radius:8px!important;padding:2px 8px!important;box-shadow:none!important;}
.lf-tower::before{display:none!important;}

/* ビュー切替 */
#vsw{
  position:absolute;bottom:56px;left:50%;transform:translateX(-50%);
  display:flex;background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.18);border-radius:24px;overflow:hidden;z-index:30;
}
.vb{
  padding:10px 22px;border:none;background:transparent;
  color:rgba(255,255,255,.5);font-size:12px;font-weight:500;
  cursor:pointer;-webkit-appearance:none;white-space:nowrap;
}
.vb.on{background:rgba(91,200,255,.18);color:#5bc8ff;}

/* スポット数 */
#ct{
  position:absolute;bottom:100px;left:50%;transform:translateX(-50%);
  font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.06em;
  z-index:20;pointer-events:none;white-space:nowrap;
}

/* 方位補正UI */
#calib{
  position:absolute;bottom:108px;left:50%;transform:translateX(-50%);
  z-index:40;display:none;
  background:rgba(0,10,30,.88);border:1px solid rgba(91,200,255,.3);
  border-radius:16px;padding:10px 16px;text-align:center;white-space:nowrap;
}
#calib-label{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.05em;margin-bottom:8px;}
#calib-row{display:flex;align-items:center;gap:12px;justify-content:center;}
.calib-btn{
  width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(91,200,255,.5);background:rgba(91,200,255,.12);
  color:#5bc8ff;font-size:20px;font-weight:700;
  cursor:pointer;-webkit-appearance:none;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
#dbg{
  font-size:10px;color:#3de8c8;letter-spacing:.04em;
  margin-bottom:8px;font-family:ui-monospace,monospace;
}
#flipbtn{
  margin-top:10px;padding:8px 18px;border-radius:20px;
  border:1px solid rgba(91,200,255,.5);background:rgba(91,200,255,.1);
  color:#5bc8ff;font-size:13px;font-weight:700;
  -webkit-appearance:none;cursor:pointer;display:block;width:100%;
}
#calib-val{font-size:17px;font-weight:700;color:#5bc8ff;width:64px;text-align:center;}

/* ジャイロボタン（画面下部に固定） */
#gyrobtn{
  position:absolute;bottom:112px;left:50%;transform:translateX(-50%);
  padding:12px 28px;border-radius:28px;
  border:2px solid #5bc8ff;background:rgba(0,20,50,.9);
  color:#5bc8ff;font-size:15px;font-weight:700;
  cursor:pointer;-webkit-appearance:none;
  z-index:40;white-space:nowrap;
  display:block;
}

/* 詳細パネル */
#panel{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(4,12,28,.93);border-top:1px solid rgba(255,255,255,.15);
  padding:0 20px 32px;
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.16,1,.3,1);
  z-index:50;max-height:60vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
#panel.open{transform:translateY(0);}
#panel.open ~ #credit, body.panel-open #credit{
  transition:opacity .3s ease;opacity:0;}
.ph{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:14px auto 16px;}
.ptop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.pname{font-size:20px;font-weight:700;line-height:1.3;flex:1;}
.pclose{
  width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.1);border:none;
  color:#fff;font-size:14px;cursor:pointer;
  flex-shrink:0;margin-left:10px;-webkit-appearance:none;
}
.ptags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.tag{font-size:11px;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.75);}
.tagh{background:rgba(91,200,255,.14);color:#5bc8ff;border:1px solid rgba(91,200,255,.3);}
.pdesc{font-size:13px;line-height:1.8;color:rgba(255,255,255,.75);margin-bottom:16px;}
#pimg{width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:14px;display:none;}
#pimgload{width:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.3);font-size:12px;}
#pimgload:not(:empty){height:56px;margin-bottom:12px;}
.pstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);}
.sv{font-size:20px;font-weight:700;color:#5bc8ff;text-align:center;line-height:1;margin-bottom:3px;}
.sl{font-size:10px;color:rgba(255,255,255,.4);text-align:center;letter-spacing:.07em;}

#op{
  position:fixed;inset:0;z-index:99999;
  background:linear-gradient(175deg,#020810 0%,#051628 15%,#082540 30%,#0e3d5c 45%,#1a5c78 55%,#1e6860 65%,#164a38 78%,#0a2820 90%,#050f15 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .6s ease;
}
.op-haze{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;}
.op-sea{position:absolute;bottom:0;left:0;right:0;height:35%;background:linear-gradient(180deg,rgba(10,50,90,.7),rgba(5,20,45,.9));}
.op-horizon{position:absolute;bottom:35%;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(91,200,255,.4),transparent);}
.op-islands{position:absolute;bottom:34%;left:0;right:0;height:60px;
  background:
    radial-gradient(ellipse 100px 35px at 12% 80%,rgba(15,40,25,.9) 0%,transparent 100%),
    radial-gradient(ellipse 180px 45px at 38% 85%,rgba(18,45,30,.9) 0%,transparent 100%),
    radial-gradient(ellipse 80px 30px at 58% 75%,rgba(14,38,22,.85) 0%,transparent 100%),
    radial-gradient(ellipse 130px 40px at 78% 82%,rgba(16,42,28,.88) 0%,transparent 100%),
    radial-gradient(ellipse 55px 22px at 92% 70%,rgba(12,32,18,.8) 0%,transparent 100%);
}
.op-glass{
  position:relative;z-index:10;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.18);
  border-radius:24px;padding:32px 36px 28px;
  text-align:center;max-width:300px;width:86%;
  box-shadow:0 8px 40px rgba(0,0,0,.45);
}
.op-badge{font-size:10px;letter-spacing:.15em;color:rgba(91,200,255,.8);border:1px solid rgba(91,200,255,.3);border-radius:20px;padding:3px 12px;margin-bottom:18px;display:inline-block;background:rgba(91,200,255,.08);}
.op-h1{font-size:26px;font-weight:700;color:#fff;line-height:1.4;margin-bottom:6px;letter-spacing:.04em;text-shadow:0 0 30px rgba(91,200,255,.4);}
.op-sub{font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.45);margin-bottom:8px;}
.op-tag{font-size:13px;color:rgba(255,255,255,.55);line-height:1.7;margin-bottom:24px;}
.op-ring{width:60px;height:60px;margin:0 auto 8px;position:relative;}
.op-ring svg{width:60px;height:60px;transform:rotate(-90deg);}
.op-ring-n{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:22px;font-weight:700;color:#5bc8ff;}
.op-note{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.06em;}

/* ── 位置合わせモード ── */
#aim{
  position:absolute;inset:0;z-index:60;display:none;
}
#aim.show{display:block;}
#aim-cross{
  position:absolute;top:0;bottom:0;left:50%;width:1px;
  background:linear-gradient(180deg,transparent,rgba(255,220,80,.9) 20%,rgba(255,220,80,.9) 80%,transparent);
  pointer-events:none;
}
#aim-cross::before{
  content:'';position:absolute;top:50%;left:-14px;
  width:28px;height:1px;background:rgba(255,220,80,.9);
}
#aim-top{
  position:absolute;top:0;left:0;right:0;
  padding:70px 20px 16px;text-align:center;
  background:linear-gradient(180deg,rgba(0,10,30,.92),rgba(0,10,30,.75) 70%,transparent);
  pointer-events:none;
}
#aim-title{font-size:15px;font-weight:700;color:#ffdc50;margin-bottom:6px;letter-spacing:.04em;}
#aim-desc{font-size:12px;color:rgba(255,255,255,.65);line-height:1.6;}
#aim-bottom{
  position:absolute;bottom:0;left:0;right:0;
  padding:14px 12px 26px;
  background:linear-gradient(0deg,rgba(0,10,30,.95),rgba(0,10,30,.8) 60%,transparent);
}
#aim-list{
  display:flex;gap:8px;overflow-x:auto;padding:2px 4px 12px;
  -webkit-overflow-scrolling:touch;
}
.aim-chip{
  flex:0 0 auto;padding:9px 15px;border-radius:20px;
  border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);
  color:rgba(255,255,255,.8);font-size:13px;font-weight:600;
  white-space:nowrap;-webkit-appearance:none;
}
.aim-chip.sel{border-color:#ffdc50;background:rgba(255,220,80,.18);color:#ffdc50;}
#aim-actions{display:flex;gap:10px;padding:0 4px;}
#aim-ok,#aim-cancel{
  flex:1;padding:13px 0;border-radius:24px;font-size:14px;font-weight:700;
  -webkit-appearance:none;border:1px solid;
}
#aim-ok{border-color:#ffdc50;background:rgba(255,220,80,.2);color:#ffdc50;}
#aim-ok.off{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:rgba(255,255,255,.3);}
#aim-cancel{border-color:rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.6);}
#aimbtn{
  margin-top:12px;padding:10px 0;border-radius:20px;width:100%;
  border:1px solid rgba(255,220,80,.5);background:rgba(255,220,80,.12);
  color:#ffdc50;font-size:13px;font-weight:700;-webkit-appearance:none;
}

#aim-sign{
  width:100%;padding:14px 0;border-radius:24px;margin-bottom:12px;
  border:2px solid #ffdc50;background:rgba(255,220,80,.18);
  color:#ffdc50;font-size:15px;font-weight:700;-webkit-appearance:none;
}
#aim-or{
  font-size:11px;color:rgba(255,255,255,.4);text-align:center;
  margin-bottom:8px;letter-spacing:.05em;
}


/* ── 音声ガイド（スポットと無関係・常時表示） ── */
#gaudio{
  position:absolute;top:60px;left:12px;z-index:30;
  padding:7px 14px;border-radius:20px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.45);
  color:rgba(255,255,255,.75);
  font-size:11.5px;font-weight:600;letter-spacing:.02em;
  -webkit-appearance:none;display:flex;align-items:center;gap:5px;
  white-space:nowrap;
}
#gaudio.playing{
  border-color:#3de8c8;color:#3de8c8;background:rgba(61,232,200,.14);
}
#gaudio.off{
  border-color:rgba(255,255,255,.12);color:rgba(255,255,255,.3);
}
#gaudio-icon{font-size:13px;line-height:1;}

/* ── クレジット表記（右下に常時表示） ── */
#credit{
  transition:opacity .3s ease;
  position:absolute;
  right:10px;
  bottom:8px;
  z-index:35;
  text-align:right;
  font-size:8px;
  line-height:1.55;
  color:rgba(255,255,255,.38);
  letter-spacing:.02em;
  text-shadow:0 1px 3px rgba(0,0,0,.85);
  pointer-events:none;
  user-select:none;
  -webkit-user-select:none;
}
</style>
</head>
<body>

<div id="op">
  <div class="op-haze" style="width:500px;height:200px;top:5%;left:-10%;background:rgba(91,170,220,.1);"></div>
  <div class="op-haze" style="width:350px;height:150px;top:25%;right:-5%;background:rgba(61,180,160,.09);"></div>
  <div class="op-horizon"></div>
  <div class="op-islands"></div>
  <div class="op-sea"></div>
  <div class="op-glass">
    <div class="op-badge">Gorogatake Sky Tower</div>
    <div class="op-h1">天空の<br>透明な図書館</div>
    <div class="op-sub">五老スカイタワー AR展望ガイド</div>
    <div class="op-tag">絶景の「意味」を知り、<br>記憶に刻む。</div>
    <div class="op-ring">
      <svg viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="26" fill="none" stroke="rgba(91,200,255,.2)" stroke-width="3"/>
        <circle id="opc" cx="30" cy="30" r="26" fill="none" stroke="#5bc8ff" stroke-width="3"
          stroke-dasharray="163.4" stroke-dashoffset="0" stroke-linecap="round"/>
      </svg>
      <div class="op-ring-n" id="opn">5</div>
    </div>
    <div class="op-note">秒後に自動で開始</div>
  </div>
</div>
<div id="camera-bg">
  <video id="camera-video" autoplay playsinline muted></video>
  <div id="camera-fallback"></div>
</div>
<div id="bg" style="position:absolute;inset:0;pointer-events:none;background:transparent;"></div>

<div id="hud">
  <div><div class="ht">五老スカイタワー</div><div class="hs">AR LANDSCAPE GUIDE</div></div>
  <div><div class="hd" id="hdeg">30°</div><div class="hdir" id="hdir">北東</div></div>
</div>

<div id="lang">
  <button class="lb on" data-l="ja">日本語</button>
  <button class="lb" data-l="en">EN</button>
  <button class="lb" data-l="zh">中文</button>
</div>

<button id="gaudio"><span id="gaudio-icon">🔊</span><span id="gaudio-label">音声ガイド</span></button>

<div id="filters">
  <button class="fb on" data-l="近景">近景 ～5km</button>

var DIRS_JA = ['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
var DIRS_EN = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];

// ==============================
// STATE
// ==============================
var lang = 'ja';
var bearing = 30;
var view = 'ar';
var activeL = {近景:true,中景:true,遠景:true,超遠景:true};
var FOV = 30;   // 現地実測値(縦持ち・cover表示での実効水平視野)

// ── 現地案内板の照準設定 ──────────────────────
// 案内板に照準（スリット/矢印）を設け、その狙い先の方位角をここに入れる。
// 既定は舞鶴クレインブリッジ（座標から算出した真方位 35.7°）。
// 設置後、実際の狙い先に合わせてこの2つを書き換えてください。
var SIGN_BEARING = 35.7;
var SIGN_TARGET_NAME = '舞鶴クレインブリッジ';
// ────────────────────────────────────────────
var W = window.innerWidth;
var H = window.innerHeight;
var dragging = false;
var lastTX = 0;
var vel = 0;
var gyroActive = false;
var leafMap = null;
var leafMarkers = [];

function getWH() {
  W = window.innerWidth || document.documentElement.clientWidth;
  H = window.innerHeight || document.documentElement.clientHeight;
}

// ==============================
// HUD
// ==============================
function dirLabel(deg) {
  var d = ((deg % 360) + 360) % 360;
  var i = Math.round(d / 22.5) % 16;
  return lang === 'en' ? DIRS_EN[i] : DIRS_JA[i];
}
function updateHUD() {
  var d = Math.round(((bearing % 360) + 360) % 360);
  document.getElementById('hdeg').textContent = d + '°';
  document.getElementById('hdir').textContent = dirLabel(d);
}

// ==============================
// NAME
// ==============================
function getName(s) {
  return lang === 'en' ? s.en : lang === 'zh' ? s.zh : s.ja;
}
function getDesc(s) {
  return lang === 'en' ? s.desc_en : lang === 'zh' ? s.desc_zh : s.desc_ja;
}

// ==============================
// AR RENDER
// ==============================
function bToX(b) {
  var diff = b - bearing;
  while (diff > 180) diff -= 360;
  while (diff < -180) diff += 360;
  return W / 2 + (diff / FOV) * W;
}
function layerY(l) {
  return H * ({近景:.50,中景:.42,遠景:.36,超遠景:.30}[l] || .42);
}
// ラベルを置く高さ（画面上部側の帯）。ランドマークに重ならないようにする
function labelY(l) {
  return H * ({近景:.30,中景:.25,遠景:.20,超遠景:.15}[l] || .25);
}
function stemH(l) {
  return {近景:40,中景:26,遠景:15,超遠景:7}[l] || 20;
}

function renderAR() {
  getWH();
  var ar = document.getElementById('ar');
  ar.innerHTML = '';
  var count = 0;

  // Build visible list
  var vis = [];
  for (var i = 0; i < SPOTS.length; i++) {
    var s = SPOTS[i];
    if (!activeL[s.layer]) continue;
    var x = bToX(s.b);
    if (x < -100 || x > W + 100) continue;
    vis.push({s:s, ax:x, ay:layerY(s.layer), lx:x, ly:labelY(s.layer), sh:stemH(s.layer)});
  }

  // ラベル配置：段組みで確実に重なりを解消する
  // ラベルは対応ポインターの真上（lx = ax）に固定し、縦の段だけをずらす
  var LAYER_ORDER = {超遠景:0, 遠景:1, 中景:2, 近景:3};
  var ROW_TOP   = H * 0.125;  // 最上段の位置
  var ROW_PITCH = 29;         // 段の間隔
  var MAX_ROWS  = 8;
  var LBL_GAP   = 120;        // 同じ段で許容する最小の横間隔

  // 遠いものを上の段に置く（遠近感を保つ）
  vis.sort(function(a, b) {
    var d = LAYER_ORDER[a.s.layer] - LAYER_ORDER[b.s.layer];
    return d !== 0 ? d : a.ax - b.ax;
  });

  var rows = [];
  for (var ri = 0; ri < MAX_ROWS; ri++) rows.push([]);

  // 画面右上のフィルターUIと重ならないよう、その帯の右側を占有済みにする
  var FILTER_BOTTOM = 190;          // フィルター列の下端(px)
  for (var ri2 = 0; ri2 < MAX_ROWS; ri2++) {
    if (ROW_TOP + ri2 * ROW_PITCH < FILTER_BOTTOM) rows[ri2].push(W - 26);
  }

  for (var k = 0; k < vis.length; k++) {
    var it = vis[k];
    it.lx = it.ax;                       // 真上に置く
    var placed = false;
    for (var r = 0; r < MAX_ROWS; r++) {
      var ok = true;
      for (var m = 0; m < rows[r].length; m++) {
        if (Math.abs(rows[r][m] - it.lx) < LBL_GAP) { ok = false; break; }
      }
      if (ok) {
        rows[r].push(it.lx);
        it.ly = ROW_TOP + r * ROW_PITCH;
        placed = true;
        break;
      }
    }
    if (!placed) {
      // 全段が埋まった場合：最も余裕のある段を選ぶ（重なりを最小化）
      var bestRow = 0, bestDist = -1;
      for (var r2 = 0; r2 < MAX_ROWS; r2++) {
        var minD = 1e9;
        for (var m2 = 0; m2 < rows[r2].length; m2++) {
          minD = Math.min(minD, Math.abs(rows[r2][m2] - it.lx));
        }
        if (minD > bestDist) { bestDist = minD; bestRow = r2; }
      }
      rows[bestRow].push(it.lx);
      it.ly = ROW_TOP + bestRow * ROW_PITCH;
    }
  }

  // 引き出し線は1枚のSVGにまとめ、全ラベルより下のレイヤーに置く
  var svgNS = 'http://www.w3.org/2000/svg';
  var lineLayer = document.createElementNS(svgNS, 'svg');
  lineLayer.setAttribute('width', W);
  lineLayer.setAttribute('height', H);
  lineLayer.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none;overflow:visible;';
  ar.appendChild(lineLayer);

  // Render
  for (var vi = 0; vi < vis.length; vi++) {
    var item = vis[vi];
    count++;
    var pin = document.createElement('div');
    pin.className = 'pin';
    pin.setAttribute('data-l', item.s.layer);
    pin.style.left = '0';
    pin.style.top = '0';

    // 画面中央からの距離で透明度を落とす（外側ほど薄く）
    var edge = Math.abs(item.ax - W / 2) / (W / 2);          // 0=中央 1=画面端
    var fade = Math.max(0.12, 1 - Math.pow(edge, 1.6) * 0.95);
    pin.style.opacity = fade.toFixed(3);

    // ぼかしたポインター（おおよその位置を示す）
    var halo = document.createElement('div');
    halo.className = 'pdot';
    halo.style.left = Math.round(item.ax) - 32 + 'px';
    halo.style.top  = Math.round(item.ay) - 32 + 'px';
    pin.appendChild(halo);

    var core = document.createElement('div');
    core.className = 'pdot-core';
    core.style.left = Math.round(item.ax) - 7 + 'px';
    core.style.top  = Math.round(item.ay) - 7 + 'px';
    pin.appendChild(core);

    // ステムは引き出し線に統合

    // Label at adjusted position
    var lbl = document.createElement('div');
    lbl.className = 'plabel';
    lbl.textContent = getName(item.s);
    lbl.style.left = Math.round(item.lx) + 'px';
    lbl.style.top = Math.round(item.ly) + 'px';
    pin.appendChild(lbl);

    // 引き出し線：ラベル下端 → ポインター（共有レイヤーへ）
    var ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('x1', item.lx);
    ln.setAttribute('y1', item.ly + 22);
    ln.setAttribute('x2', item.ax);
    ln.setAttribute('y2', item.ay - 14);
    ln.setAttribute('stroke', 'rgba(255,255,255,0.3)');
    ln.setAttribute('stroke-width', '1');
    ln.setAttribute('stroke-dasharray', '3,3');
    ln.setAttribute('opacity', fade.toFixed(3));
    lineLayer.appendChild(ln);

    (function(spot) {
      // tap detection: touchend with small movement
      var tsx = 0, tsy = 0;
      pin.addEventListener('touchstart', function(e) {
        tsx = e.touches[0].clientX;
        tsy = e.touches[0].clientY;
      }, true);
      pin.addEventListener('touchend', function(e) {
        if (Math.abs(e.changedTouches[0].clientX - tsx) < 12 &&
            Math.abs(e.changedTouches[0].clientY - tsy) < 12) {
          e.stopPropagation();
          openPanel(spot);
        }
      }, true);
      pin.addEventListener('click', function(e) {
        e.stopPropagation();
        openPanel(spot);
      });
    })(item.s);

    ar.appendChild(pin);
  }

  document.getElementById('ct').textContent = count + ' スポットを表示中';
}

function bdToLatLon(b, d) {
  var R = 6371;
  var lat1 = BASE_LAT * Math.PI / 180;
  var lon1 = BASE_LON * Math.PI / 180;
  var br = b * Math.PI / 180;
  var dr = d / R;
  var lat2 = Math.asin(Math.sin(lat1) * Math.cos(dr) + Math.cos(lat1) * Math.sin(dr) * Math.cos(br));
  var lon2 = lon1 + Math.atan2(Math.sin(br) * Math.sin(dr) * Math.cos(lat1), Math.cos(dr) - Math.sin(lat1) * Math.sin(lat2));
  return [lat2 * 180 / Math.PI, lon2 * 180 / Math.PI];
}

var COLS = {近景:'#5bc8ff',中景:'#3de8c8',遠景:'#a78bfa',超遠景:'#f472b6'};

function renderMap() {
  if (!leafMap) {
    leafMap = L.map('leafmap', {center:[BASE_LAT, BASE_LON], zoom:10, zoomControl:true, attributionControl:false});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {maxZoom:18, subdomains:'abcd'}).addTo(leafMap);
    var ti = L.divIcon({html:'<div style="width:14px;height:14px;border-radius:50%;background:#ffd740;border:3px solid #fff;box-shadow:0 0 12px rgba(255,215,64,.7);"></div>',className:'',iconSize:[14,14],iconAnchor:[7,7]});
    L.marker([BASE_LAT, BASE_LON], {icon:ti}).bindTooltip('五老スカイタワー', {permanent:true, direction:'top', className:'lf-tower', offset:[0,-8]}).addTo(leafMap);
  }
  leafMarkers.forEach(function(m) { leafMap.removeLayer(m); });
  leafMarkers = [];
  var rings = [{km:5,c:'#5bc8ff'},{km:15,c:'#3de8c8'},{km:40,c:'#a78bfa'},{km:150,c:'#f472b6'}];
  rings.forEach(function(r) {
    var ci = L.circle([BASE_LAT, BASE_LON], {radius:r.km*1000, color:r.c, weight:1, opacity:.2, fillOpacity:0, dashArray:'4,4'}).addTo(leafMap);
    leafMarkers.push(ci);
  });
  SPOTS.forEach(function(s) {
    if (!activeL[s.layer]) return;
    var c = bdToLatLon(s.b, s.dist);
    var col = COLS[s.layer] || '#fff';
    var di = L.divIcon({html:'<div style="width:10px;height:10px;border-radius:50%;background:'+col+';border:2px solid rgba(255,255,255,.5);box-shadow:0 0 6px '+col+';"></div>',className:'',iconSize:[10,10],iconAnchor:[5,5]});
    var mk = L.marker(c, {icon:di}).addTo(leafMap);
    mk.bindTooltip(getName(s), {direction:'top', offset:[0,-6], className:'lf-tip'});
    (function(spot) { mk.on('click', function() { openPanel(spot); }); })(s);
    leafMarkers.push(mk);
  });
  setTimeout(function() { leafMap.invalidateSize(); }, 150);
}

function fetchWikiImg(name, cb) {
  var q = name.replace(/（[^）]*）/g, '').replace(/\s*[\(（].*?[\)）]\s*/g, '').trim();
  var url = 'https://ja.wikipedia.org/w/api.php?action=query&titles=' + encodeURIComponent(q) + '&prop=pageimages&pithumbsize=600&format=json&origin=*';
  fetch(url).then(function(r) { return r.json(); }).then(function(d) {
    var pg = d.query && d.query.pages && Object.values(d.query.pages)[0];
    if (pg && pg.thumbnail) { cb(pg.thumbnail.source); }
    else { cb(null); }
  }).catch(function() { cb(null); });
}

var arEl = document.getElementById('ar');
arEl.addEventListener('touchstart', function(e) {
  if (e.target.closest('#panel')) return;
  dragging = true;
  lastTX = e.touches[0].clientX;
  vel = 0;
}, {passive:true});

arEl.addEventListener('touchmove', function(e) {
  if (!dragging) return;
  e.preventDefault();
  var dx = e.touches[0].clientX - lastTX;
  vel = dx;
  bearing -= (dx / W) * FOV;
  lastTX = e.touches[0].clientX;
  renderAR();
  updateHUD();
}, {passive:false});

arEl.addEventListener('touchend', function() {
  dragging = false;
  inertia();
}, {passive:true});

arEl.addEventListener('mousedown', function(e) { dragging = true; lastTX = e.clientX; vel = 0; });
document.addEventListener('mousemove', function(e) {
  if (!dragging) return;
  var dx = e.clientX - lastTX;
  vel = dx; bearing -= (dx / W) * FOV;
  lastTX = e.clientX; renderAR(); updateHUD();
});
document.addEventListener('mouseup', function() { dragging = false; inertia(); });

function inertia() {
  var v = vel;
  function step() {
    if (Math.abs(v) < 0.3) return;
    bearing -= (v / W) * FOV;
    v *= 0.90;
    renderAR(); updateHUD();
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

var bearingOffset = -25;   // 現地実測の方位補正

var headingFlip = false;   // 反転トグル
var headingSrc = '-';      // 診断用: 値の取得元
var headingRaw = 0;        // 診断用: 生値

function startGyro() {
  gyroActive = true;
  window.addEventListener('deviceorientation', function(e) {
    if (dragging) return;

    var raw = null;
    if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) {
      raw = e.webkitCompassHeading;   // iOS Safari: 真北基準
      headingSrc = 'compass';
    } else if (typeof e.alpha === 'number' && e.alpha !== null) {
      raw = (360 - e.alpha) % 360;    // その他: alphaを反転
      headingSrc = 'alpha';
    }
    if (raw === null) { headingSrc = 'なし'; updateDbg(); return; }

    headingRaw = raw;
    var h = headingFlip ? (360 - raw) % 360 : raw;
    bearing = (h + bearingOffset + 360) % 360;
    if (view === 'ar') { renderAR(); updateHUD(); }
    updateDbg();
  }, false);
}

function updateDbg() {
  var d = document.getElementById('dbg');
  if (!d) return;
  d.textContent = headingSrc + ' / 生:' + Math.round(headingRaw) + '° / 表示:' +
    Math.round(bearing) + '°' + (headingFlip ? ' / 反転ON' : '');
}



var gyrobtn = document.getElementById('gyrobtn');

function adjFov(delta) {
  FOV = Math.max(30, Math.min(120, FOV + delta));
  document.getElementById('fov-val').textContent = FOV + '°';
  if (view === 'ar') renderAR();
}

function adjOffset(delta) {
  bearingOffset = (bearingOffset + delta + 360) % 360;
  if (bearingOffset > 180) bearingOffset -= 360;
  document.getElementById('calib-val').textContent = (bearingOffset >= 0 ? '+' : '') + bearingOffset + '°';
}

function showCalib() {
  gyrobtn.style.display = 'none';
  var cal = document.getElementById('calib');
  cal.style.display = 'block';
  function mk(id, delta) {
    var b = document.getElementById(id);
    b.addEventListener('touchstart', function(e) { e.preventDefault(); adjOffset(delta); }, {passive:false});
    b.addEventListener('click', function() { adjOffset(delta); });
  }
  mk('calib-minus', -5);
  mk('calib-plus', +5);
  function mkf(id, d) {
    var b = document.getElementById(id);
    b.addEventListener('touchstart', function(e){ e.preventDefault(); adjFov(d); }, {passive:false});
    b.addEventListener('click', function(){ adjFov(d); });
  }
  mkf('fov-minus', -3);
  mkf('fov-plus', +3);
  document.getElementById('fov-val').textContent = FOV + '°';
  updateDbg();
}

function requestGyro() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(function(state) {
      if (state === 'granted') { startGyro(); showCalib(); }
      else { gyrobtn.textContent = '許可が必要です'; }
    }).catch(function() { startGyro(); showCalib(); });
  } else {
    startGyro(); showCalib();
  }
}
gyrobtn.addEventListener('click', requestGyro);
gyrobtn.addEventListener('touchend', function(e) { e.preventDefault(); requestGyro(); });

function buildAimList() {
  var list = document.getElementById('aim-list');
  list.innerHTML = '';
  AIM_NAMES.forEach(function(nm) {
    var spot = null;
    for (var i = 0; i < SPOTS.length; i++) { if (SPOTS[i].ja === nm) { spot = SPOTS[i]; break; } }
    if (!spot) return;
    var chip = document.createElement('button');
    chip.className = 'aim-chip';
    chip.textContent = getName(spot);
    (function(sp, el) {
      function pick() {
        aimTarget = sp;
        var all = list.querySelectorAll('.aim-chip');
        for (var k = 0; k < all.length; k++) all[k].classList.remove('sel');
        el.classList.add('sel');
        document.getElementById('aim-ok').classList.remove('off');
        document.getElementById('aim-desc').innerHTML =
          '<b style="color:#ffdc50">' + getName(sp) + '</b> に黄色い線を重ねて<br>「決定」を押してください';
      }
      el.addEventListener('touchstart', function(e){ e.preventDefault(); pick(); }, {passive:false});
      el.addEventListener('click', pick);
    })(spot, chip);
    list.appendChild(chip);
  });
}

function openAim() {
  aimTarget = null;
  buildAimList();
  document.getElementById('aim-ok').classList.add('off');
  document.getElementById('aim-desc').innerHTML =
    '案内板の照準をのぞき、<br>黄色い線を重ねてボタンを押してください';
  document.getElementById('aim').classList.add('show');
  document.getElementById('calib').style.display = 'none';
}

function closeAim() {
  document.getElementById('aim').classList.remove('show');
  document.getElementById('calib').style.display = 'block';
}

function applyAim() {
  if (!aimTarget) return;
  // 画面中央 = aimTarget.b になるようオフセットを決定
  var off = aimTarget.b - headingRaw;
  off = ((off + 180) % 360 + 360) % 360 - 180;   // -180..180 に正規化
  bearingOffset = Math.round(off);
  document.getElementById('calib-val').textContent =
    (bearingOffset >= 0 ? '+' : '') + bearingOffset + '°';
  bearing = ((headingRaw + bearingOffset) % 360 + 360) % 360;
  renderAR(); updateHUD(); updateDbg();
  closeAim();
}

// 案内板の照準方向を画面中央に一致させる
function applySign() {
  var off = SIGN_BEARING - headingRaw;
  off = ((off + 180) % 360 + 360) % 360 - 180;
  bearingOffset = Math.round(off);
  document.getElementById('calib-val').textContent =
    (bearingOffset >= 0 ? '+' : '') + bearingOffset + '°';
  bearing = ((headingRaw + bearingOffset) % 360 + 360) % 360;
  renderAR(); updateHUD(); updateDbg();
  closeAim();
}

function gAudioSetBtn(state) {
  var b = document.getElementById('gaudio');

  var lb = document.getElementById('gaudio-label');
  if (!b) return;
  b.classList.remove('playing', 'off');

    b.classList.add('playing'); ic.textContent = '■';
    lb.textContent = lang === 'en' ? 'Stop' : lang === 'zh' ? '停止' : '停止';
  } else if (state === 'off') {

    lb.textContent = lang === 'en' ? 'Audio Guide' : lang === 'zh' ? '语音导览' : '音声ガイド';
  }
}

function gAudioStop() {
  if (gAudioEl) { try { gAudioEl.pause(); } catch (e) {} gAudioEl = null; }
  gPlaying = false;
  gAudioSetBtn('idle');
}

function gAudioToggle() {
  if (gPlaying) { gAudioStop(); return; }
  var url = GLOBAL_AUDIO[lang];
  if (!url) { gAudioSetBtn('off'); return; }
  gAudioEl = new Audio(url);
  gAudioEl.onplaying = function () { gPlaying = true; gAudioSetBtn('playing'); };
  gAudioEl.onended   = function () { gPlaying = false; gAudioEl = null; gAudioSetBtn('idle'); };
  gAudioEl.onerror   = function () { gPlaying = false; gAudioEl = null; gAudioSetBtn('off'); };
  var p = gAudioEl.play();
  if (p && p.catch) { p.catch(function () { gAudioSetBtn('off'); }); }
}

      video.srcObject = stream;
      video.play();
      // カメラON → フォールバック背景と海を非表示
      fallback.style.display = 'none';
      console.log('Camera started');
    })
    .catch(function(err) {
      console.log('Camera error:', err.name);
      // エラー時はフォールバック背景をそのまま表示
    });
})();

// OPENING COUNTDOWN
window.addEventListener('load', function() {
  var op = document.getElementById('op');
  var circle = document.getElementById('opc');
  var numEl = document.getElementById('opn');
  var total = 163.4;
  var count = 5;
  var n = 0;

  var t = setInterval(function() {
    n++;
    var remaining = 5 - n;
    numEl.textContent = remaining;
    circle.setAttribute('stroke-dashoffset', String(total * n / 5));
    if (n >= 5) {
      clearInterval(t);
      op.style.opacity = '0';
      setTimeout(function() { op.style.display = 'none'; }, 650);
    }
  }, 1000);
});
</script>
